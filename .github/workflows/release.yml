name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/nikki-router-setup/requirements.txt

      - name: Check tag and public source
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME.TrimStart('v')
          $source = Get-Content -Raw -Encoding UTF8 tools/nikki-router-setup/katovpn_router_setup/server.py
          if ($source -notmatch 'APP_VERSION = "([^"]+)"') { throw 'APP_VERSION was not found.' }
          if ($Matches[1] -ne $expected) { throw "Tag $expected does not match APP_VERSION $($Matches[1])." }
          ./tools/public-source-check.ps1

      - name: Install pinned build and audit tools
        run: |
          python -m pip install --disable-pip-version-check -r tools/nikki-router-setup/requirements.txt
          python -m pip install --disable-pip-version-check pip-audit==2.10.1 cyclonedx-bom==7.3.1

      - name: Audit dependencies
        run: python -m pip_audit -r tools/nikki-router-setup/requirements.txt --strict

      - name: Run tests and syntax checks
        shell: pwsh
        run: |
          python -m unittest discover -s tools/tests -p "test_*router*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/nikki-router-setup/web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q tools/nikki-router-setup/app.py tools/nikki-router-setup/katovpn_router_setup

      - name: Build portable executable
        shell: pwsh
        run: ./tools/nikki-router-setup/build.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/dist" -SkipTests

      - name: Generate SBOM and checksum
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem dist/KatoVPN-Router-Control-v*.exe)
          if ($executables.Count -ne 1) { throw "Expected one release executable, found $($executables.Count)." }
          $exe = $executables[0]
          $sbom = Join-Path $exe.DirectoryName "$($exe.BaseName).cdx.json"
          cyclonedx-py requirements tools/nikki-router-setup/requirements.txt --output-reproducible --output-format JSON --output-file $sbom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -LiteralPath (Join-Path $exe.DirectoryName 'SHA256SUMS.txt') -Encoding ascii

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/KatoVPN-Router-Control-v*.exe

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/KatoVPN-Router-Control-v*.exe
          sbom-path: dist/KatoVPN-Router-Control-${{ github.ref_name }}.cdx.json

      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --prerelease --title "KatoVPN Router Control $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
