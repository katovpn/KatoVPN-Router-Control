name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/nikki-router-setup/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r tools/nikki-router-setup/requirements.txt

      - name: Run Router Control tests
        run: python -m unittest discover -s tools/tests -p "test_*router*.py" -v

      - name: Validate JavaScript syntax
        run: node --check tools/nikki-router-setup/web/app.js

      - name: Compile Python sources
        run: python -m compileall -q tools/nikki-router-setup/app.py tools/nikki-router-setup/katovpn_router_setup
