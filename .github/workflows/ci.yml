name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/nikki-router-setup/requirements.txt

      - name: Enforce public-source allowlist
        shell: pwsh
        run: ./tools/public-source-check.ps1

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tools/nikki-router-setup/requirements.txt
          python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit dependencies
        run: python -m pip_audit -r tools/nikki-router-setup/requirements.txt --strict

      - name: Run Router Control tests
        run: python -m unittest discover -s tools/tests -p "test_*router*.py" -v

      - name: Validate JavaScript syntax
        run: node --check tools/nikki-router-setup/web/app.js

      - name: Compile Python sources
        run: python -m compileall -q tools/nikki-router-setup/app.py tools/nikki-router-setup/katovpn_router_setup
